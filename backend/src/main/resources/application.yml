app:
  jwt:
    secret: 5f4dcc3b5aa765d61d8327deb882cf99c0a6e7d9b8f4a23c5e1d6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b1c2d3e4f5a6b7c8
    access-token-expiration-ms: 900000        # 15 minutes
    refresh-token-expiration-ms: 604800000    # 7 days

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/whats_happening
    username: postgres
    password: 1234
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  jackson:
    date-format: yyyy-MM-dd'T'HH:mm:ss
    time-zone: UTC
  mvc:
    format:
      date-time: iso

server:
  port: 8080